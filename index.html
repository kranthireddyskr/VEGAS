<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: phone-first single column (max 560px), sticky header, fixed bottom tab bar, cards only for live state. */
:root{
  --bg:#0b1026; --bg2:#0f1531; --surface:#141b3d; --surface2:#1c2550; --line:#2a3466;
  --fg:#eef0ff; --muted:#97a0c8; --faint:#6d769e;
  --pink:#ff3fa4; --gold:#ffc53d; --canyon:#ff7a33; --violet:#b47cff; --cyan:#3fd0ff;
  --ok:#3ddc97; --warn:#ff9f1c; --bad:#ff4d5e;
  --pink-ink:#ff6fbd; --on-accent:#140a1c;
  --glow:0 0 18px rgba(255,63,164,.45);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f1f8; --bg2:#ebe8f3; --surface:#ffffff; --surface2:#f0edf7; --line:#d9d3e6;
  --fg:#16163a; --muted:#5b5d80; --faint:#8a8ca8;
  --pink:#d0136f; --gold:#a96e00; --canyon:#c24e14; --violet:#7438d6; --cyan:#0a7fa8;
  --ok:#11845a; --warn:#b85c00; --bad:#c8102e;
  --pink-ink:#c0106a; --on-accent:#ffffff;
  --glow:none;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  background:radial-gradient(1200px 500px at 50% -200px,rgba(255,63,164,.12),transparent 60%),var(--bg);
  background-attachment:fixed;min-height:100vh}
:root[data-theme="light"] body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.04em;line-height:1;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .a{color:var(--gold)} .brand .b{color:var(--pink);text-shadow:var(--glow)} .brand .s{color:var(--faint);font-size:.7em;padding:0 4px}
.chip-btn{min-height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.chip-btn svg{width:18px;height:18px}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{display:none;padding-block:14px 24px;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .tabrow{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr)}
.tabs button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em;cursor:pointer;padding:6px 0;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--pink-ink)}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--pink);box-shadow:var(--glow)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:800}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:18px 0 10px}
.sec-head:first-child{margin-top:4px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.pad-s{padding:10px 12px}
.card.neon{border-color:color-mix(in srgb,var(--pink) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--pink) 20%,transparent),var(--glow)}
.card.gold{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.card.canyon{border-color:color-mix(in srgb,var(--canyon) 60%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--canyon) 10%,var(--surface)),var(--surface))}

/* buttons and fields */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:var(--on-accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1200}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line));background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.icon{width:40px;min-height:40px;padding:0}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.4}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px;background-repeat:no-repeat}
select.sm,input.sm{min-height:38px;font-size:14px;padding:6px 10px}
select.sm{background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;min-width:0}
.check{appearance:none;-webkit-appearance:none;width:28px;height:28px;min-width:28px;border-radius:8px;border:2px solid var(--faint);background:var(--bg2);cursor:pointer;display:inline-grid;place-content:center;margin:0}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:12px;height:7px;border-left:3px solid #07160f;border-bottom:3px solid #07160f;transform:rotate(-45deg) translate(1px,-1px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3:not(.stats){grid-template-columns:1fr 1fr}}
.stats .stat{padding:10px}.stats .stat b{font-size:26px}

/* home */
.hero{padding:18px 16px;border-radius:18px;border:1px solid var(--line);background:
  radial-gradient(400px 160px at 85% 0%,color-mix(in srgb,var(--pink) 22%,transparent),transparent 70%),
  radial-gradient(360px 160px at 0% 100%,color-mix(in srgb,var(--canyon) 22%,transparent),transparent 70%),var(--surface);position:relative;overflow:hidden}
.hero .stars{position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(1px 1px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 38% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 88% 60%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 70%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 80%,#fff 50%,transparent 51%)}
:root[data-theme="light"] .hero .stars{display:none}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;position:relative}
.count div{background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.count b{display:block;font-family:var(--f-display);font-size:38px;font-weight:900;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.count span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;border:1px solid currentColor;white-space:nowrap}

function findLeg(id){ for(var i=0;i<state.drive.length;i++) for(var j=0;j<state.drive[i].legs.length;j++) if(state.drive[i].legs[j].id===id) return state.drive[i].legs[j]; return null; }
function autoAssign(){
  var T = state.travelers.map(function(t){return t.id;}); if(!T.length) return;
  var legs = allLegs(), cnt = {}, ncnt = {}, co = {}, last = {}, prev = "";
  T.forEach(function(id,i){ cnt[id]=0; ncnt[id]=0; co[id]=0; last[id]=-10-i; });
  legs.forEach(function(x, k){
    var night = isNight(x.l);
    var cands = T.filter(function(id){ return T.length<2 || id!==prev; });
    cands.sort(function(a,b){
      var sa = (night?ncnt[a]*1000:0) + cnt[a]*100 + last[a];
      var sb = (night?ncnt[b]*1000:0) + cnt[b]*100 + last[b];
      return sa - sb;
    });
    var d = cands[0];
    x.l.driver = d; cnt[d]++; if(night) ncnt[d]++;
    var coC = T.filter(function(id){ return id!==d && (T.length<3 || id!==prev); });
    if(!coC.length) coC = T.filter(function(id){ return id!==d; });
    coC.sort(function(a,b){ return (co[a]-co[b]) || (last[a]-last[b]); });
    x.l.co = coC[0] || ""; if(coC[0]) co[coC[0]]++;
    last[d] = k; prev = d;
  });
  save(); renderDrive(); toast("Drivers assigned");
}

      if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
    }).then(function(j){

/* ---------- EXPENSES ---------- */
var CATS = ["gas","hotel","food","tickets","parking","other"];
function expenseSummary(){
  var paid = {}, share = {}, cat = {}, total = 0;
  state.travelers.forEach(function(t){ paid[t.id]=0; share[t.id]=0; });
  state.expenses.forEach(function(e){
    var c = Math.round(e.cents); total += c; cat[e.cat] = (cat[e.cat]||0) + c;
    paid[e.paidBy] = (paid[e.paidBy]||0) + c;
    var who = (e.split||[]).filter(Boolean); if(!who.length) return;
    var base = Math.floor(c / who.length), rem = c - base*who.length;
    who.forEach(function(id, i){ share[id] = (share[id]||0) + base + (i<rem?1:0); });
  });
  var ids = Object.keys(Object.assign({}, paid, share));
  var net = {}; ids.forEach(function(id){ net[id] = (paid[id]||0) - (share[id]||0); });
  return {paid:paid, share:share, net:net, cat:cat, total:total, ids:ids, settle:settle(net)};
}
function settle(net){
  /* greedy: largest debtor pays largest creditor; yields at most n-1 payments */
  var cr = [], db = [];
  Object.keys(net).forEach(function(id){ if(net[id] > 0) cr.push({id:id, v:net[id]}); else if(net[id] < 0) db.push({id:id, v:-net[id]}); });
  var out = [];
  while(cr.length && db.length){
    cr.sort(function(a,b){return b.v-a.v;}); db.sort(function(a,b){return b.v-a.v;});
    var c = cr[0], d = db[0];
    /* prefer an exact match if one exists, which saves a payment */
    for(var i=0;i<db.length;i++){ for(var j=0;j<cr.length;j++){ if(db[i].v===cr[j].v){ d = db[i]; c = cr[j]; i = db.length; break; } } }
    var x = Math.min(c.v, d.v);
    out.push({from:d.id, to:c.id, cents:x});
    c.v -= x; d.v -= x;
    cr = cr.filter(function(o){return o.v>0;}); db = db.filter(function(o){return o.v>0;});
  }
  return out;
}

function addExpense(){
  var amt = parseFloat($("#x-amt").value), split = [];
  document.querySelectorAll("#x-split input:checked").forEach(function(c){ split.push(c.value); });
  if(!(amt > 0)){ toast("Enter an amount above zero."); return; }
  if(!split.length){ toast("Pick at least one person to split with."); return; }
  state.expenses.push({id:uid(), desc:$("#x-desc").value.trim() || "Expense", cents:Math.round(amt*100), paidBy:$("#x-paid").value, split:split, cat:$("#x-cat").value, at:Date.now()});
  save(); renderExpenses(); toast("Expense added");
}
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  var el = e.target.closest && e.target.closest("[data-enter]");
  if(el && el.getAttribute("data-enter")==="pk-add"){ e.preventDefault(); addPack(el.getAttribute("data-g")); }
});
document.addEventListener("change", function(e){
  var el = e.target, f = el.getAttribute && el.getAttribute("data-f"), id = el.getAttribute && el.getAttribute("data-id");
  if(!f) return;
  if(f==="stop-done"){ var it = state.itinerary.find(function(x){return x.id===id;}); if(it){ it.done = el.checked; save(); el.closest(".stop").classList.toggle("done", el.checked); } }
  else if(f==="leg-done"){ var l = findLeg(id); if(l){ l.done = el.checked; save(); el.closest(".leg").classList.toggle("done", el.checked); } }
  else if(f==="leg-driver" || f==="leg-co"){ var l2 = findLeg(id); if(l2){ l2[f==="leg-driver"?"driver":"co"] = el.value; save(); renderDrive(); } }
  else if(f==="pk-done"){ var p = findPk(id); if(p){ p.it.done = el.checked; save(); renderPacking(); } }
  else if(f==="pk-who"){ var p2 = findPk(id); if(p2){ p2.it.who = el.value; save(); } }
  else if(f==="trav-name"){ renderDrive(); }
});
document.addEventListener("input", function(e){
  var el = e.target, f = el.getAttribute && el.getAttribute("data-f"), id = el.getAttribute && el.getAttribute("data-id");
  if(!f) return;
  if(f==="notes"){ state.notes = el.value; save(); var s = $("#notesSaved"); if(s) s.textContent = storageOK ? "Saved" : "Not saved: storage unavailable"; }
  else if(f==="trav-name"){ var t = trav(id); if(t){ t.name = el.value; save(); } }
  else if(f==="bk-notes"){ var b = state.bookings.find(function(x){return x.id===id;}); if(b){ b.notes = el.value; save(); } }
  else if(f==="gas"){ var k = el.getAttribute("data-k"), v = el.value===""?null:Number(el.value); state.gas[k] = (k!=="miles" && v==null) ? 0 : v; save(); updateGas(); }
});

/* ---------- live clock ---------- */
var lastPhase = phase(), tick = 0;
setInterval(function(){
  tick++;
  var ph = phase();
  if(ph !== lastPhase){ lastPhase = ph; rerender(); return; }
  if(state.settings.tab === "home"){
    var lh = $("#live-hero"); if(ph==="before" && lh) lh.innerHTML = countdownHTML();
    if(tick % 30 === 0){ var h = $("#live-home"); if(h) h.innerHTML = liveHomeInner(); }
  } else if(state.settings.tab === "drive" && tick % 30 === 0){
    var d = $("#live-duty"); if(d) d.innerHTML = dutyHTML();
    var hb = $("#live-homeby"); if(hb) hb.innerHTML = homeByHTML(false);
  }
}, 1000);

/* ---------- boot ---------- */
window.__trip = {render:rerender, state:function(){return state;}, toEpoch:toEpoch};
function setHH(){ var t=$(".top"); if(t) document.documentElement.style.setProperty("--hh", t.offsetHeight+"px"); }
window.addEventListener("resize", setHH);
applyTheme(); setHH();
var startHash = (location.hash||"").replace("#","");
showTab(startHash || state.settings.tab || "home", !!startHash);
fetchWeather();
})();
</script>
